<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Cookie</title>
</head>

<body>
    <header>
        Cookie
    </header>

    <main>
        <div class="thumbnails">
            <button id="imgButton1" aria-label="Show Cookie photo 1">
                <img src="images/dog1.jpg" alt="Cookie photo 1">
            </button>

            <button id="imgButton2" aria-label="Show Cookie photo 2">
                <img src="images/dog2.jpg" alt="Cookie photo 2">
            </button>

            <button id="imgButton3" aria-label="Show Cookie photo 3">
                <img src="images/dog3.jpg" alt="Cookie photo 3">
            </button>

            <button id="imgButton4" aria-label="Show Cookie photo 4">
                <img src="images/dog4.jpg" alt="Cookie photo 4">
            </button>
        </div>

        <div class="image-display">
            <img src="images/dog1.jpg" alt="Cookie photo 1" id="imgToToggle">
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
